parameters:
  - name: environment # dev, sit, uat, preprod, prod
    type: string
  - name: displayName
    type: string
  - name: target # mock: every environment deploys to dev resources
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: previousStage # stage that runs right before this one
    type: string
  - name: branchMatch # runtime expression: which branch normally owns this stage
    type: string
  - name: hotfixEnvironment
    type: string
  - name: deployInfraAll
    type: boolean
    default: false

stages:
  - stage: Deploy_${{ parameters.environment }}
    displayName: "Deliver to ${{ parameters.displayName }}"
    dependsOn: ${{ parameters.dependsOn }}
    # The stage always appears in the pipeline; this condition decides whether it runs or shows as Skipped.
    # A skipped previous stage must not block this one (release skips dev, main skips dev to uat).
    condition: >-
      and(
        in(dependencies.IntegrationTests.result, 'Succeeded', 'SucceededWithIssues'),
        in(dependencies.${{ parameters.previousStage }}.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
        or(
          ${{ parameters.branchMatch }},
          and(
            startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'),
            eq('${{ parameters.hotfixEnvironment }}', '${{ parameters.environment }}')
          )
        )
      )
    jobs:
      # Optional infrastructure deployment: three-step flow lives in the infra repo
      - ${{ if eq(parameters.deployInfraAll, true) }}:
          - template: deploy/templates/deploy-infra-jobs.yml@InfraRepo
            parameters:
              environment: ${{ parameters.environment }}
              target: ${{ parameters.target }}

      - deployment: DeployApp_${{ parameters.environment }}
        displayName: "Deploy application to ${{ parameters.displayName }}"
        environment: goat-${{ parameters.environment }}
        ${{ if eq(parameters.deployInfraAll, true) }}:
          dependsOn: InfraDeploy_${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop
                - task: AzureWebApp@1
                  displayName: "Deploy API to App Service"
                  inputs:
                    azureSubscription: goat-ticket-connection
                    appType: webAppLinux
                    appName: app-goat-api-${{ parameters.target }}
                    package: $(Pipeline.Workspace)/drop/api/*.zip
                    deploymentMethod: zipDeploy
                - task: AzureFunctionApp@2
                  displayName: "Deploy worker to Function App"
                  inputs:
                    azureSubscription: goat-ticket-connection
                    appType: functionAppLinux
                    appName: func-goat-worker-${{ parameters.target }}
                    package: $(Pipeline.Workspace)/drop/func/*.zip
                    deploymentMethod: zipDeploy
