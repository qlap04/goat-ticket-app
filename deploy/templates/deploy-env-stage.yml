parameters:
  - name: environment
    type: string
    values:
      - dev
      - sit
      - uat
      - preprod
      - prod

  - name: deploymentSlot
    type: string
    values:
      - none
      - staging

  - name: environmentName
    type: string

  - name: azureServiceConnection
    type: string

  - name: variableGroup
    type: string

  - name: artifactName
    type: string

  - name: apiPackageFolder
    type: string

  - name: functionPackageFolder
    type: string

  - name: smokeTestAllowSelfSignedCertificate
    type: boolean

  - name: createKeyVaultSecrets
    type: boolean

  - name: deployInfraAll
    type: boolean

  - name: infraJobName
    type: string

  - name: azureSubscriptionId
    type: string

  - name: azureLocation
    type: string

  - name: bicepVersion
    type: string

  - name: stackName
    type: string

  - name: actionOnUnmanageResources
    type: string

  - name: actionOnUnmanageResourceGroups
    type: string

  - name: denySettingsMode
    type: string

  - name: bypassStackOutOfSyncError
    type: boolean

  - name: secretGroup
    type: string

  - name: previousStage
    type: string

  - name: branchMatch
    type: string

  - name: hotfixEnvironment
    type: string
    values:
      - dev
      - sit
      - uat
      - preprod

stages:
  - stage: Deploy_${{ parameters.environment }}
    displayName: "Deliver to ${{ upper(parameters.environment) }}"
    dependsOn:
      - Build
      - ${{ if ne(parameters.previousStage, 'Build') }}:
          - ${{ parameters.previousStage }}
    condition: >-
      and(
        ne(variables['Build.Reason'], 'PullRequest'),
        in(dependencies.Build.result, 'Succeeded', 'SucceededWithIssues'),
        in(dependencies.${{ parameters.previousStage }}.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
        or(
          ${{ parameters.branchMatch }},
          and(
            startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'),
            eq('${{ parameters.hotfixEnvironment }}', '${{ parameters.environment }}')
          )
        )
      )
    jobs:
      - ${{ if eq(parameters.deployInfraAll, true) }}:
          - template: deploy/templates/deploy-infra-jobs.yml@InfraRepo
            parameters:
              environment: ${{ parameters.environment }}
              environmentName: ${{ parameters.environmentName }}
              deployJobName: ${{ parameters.infraJobName }}
              repository: InfraRepo
              azureServiceConnection: ${{ parameters.azureServiceConnection }}
              azureSubscriptionId: ${{ parameters.azureSubscriptionId }}
              azureLocation: ${{ parameters.azureLocation }}
              bicepVersion: ${{ parameters.bicepVersion }}
              stackName: ${{ parameters.stackName }}
              actionOnUnmanageResources: ${{ parameters.actionOnUnmanageResources }}
              actionOnUnmanageResourceGroups: ${{ parameters.actionOnUnmanageResourceGroups }}
              denySettingsMode: ${{ parameters.denySettingsMode }}
              bypassStackOutOfSyncError: ${{ parameters.bypassStackOutOfSyncError }}

      - deployment: DeployApp_${{ parameters.environment }}
        displayName: "Deploy application to ${{ upper(parameters.environment) }}"
        timeoutInMinutes: 45
        ${{ if eq(parameters.deployInfraAll, true) }}:
          dependsOn: ${{ parameters.infraJobName }}
        environment: ${{ parameters.environmentName }}
        variables:
          - group: ${{ parameters.variableGroup }}
          - group: ${{ parameters.secretGroup }}
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: ${{ parameters.artifactName }}

                - ${{ if eq(parameters.createKeyVaultSecrets, true) }}:
                    - task: AzureCLI@2
                      displayName: "Write application secrets to Key Vault"
                      inputs:
                        azureSubscription: ${{ parameters.azureServiceConnection }}
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: |
                          az keyvault secret set \
                            --vault-name "$KEY_VAULT_NAME" \
                            --name "Signing--TicketQrSigningKeyPem" \
                            --value "$TICKET_QR_SIGNING_KEY_VALUE" \
                            --output none
                      env:
                        KEY_VAULT_NAME: $(keyVaultName)
                        TICKET_QR_SIGNING_KEY_VALUE: $(ticketQrSigningKeyValue)

                - task: AzureAppServiceSettings@1
                  displayName: "Apply application settings to Function App"
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    appName: $(functionAppName)
                    resourceGroupName: $(appResourceGroup)
                    appSettings: $(functionAppSettingsJson)

                - task: AzureFunctionApp@2
                  displayName: "Deploy worker to Function App"
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    appType: functionAppLinux
                    appName: $(functionAppName)
                    package: $(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.functionPackageFolder }}/*.zip
                    deploymentMethod: zipDeploy

                - ${{ if ne(parameters.deploymentSlot, 'none') }}:
                    - task: AzureAppServiceSettings@1
                      displayName: "Apply application settings to the ${{ parameters.deploymentSlot }} slot"
                      inputs:
                        azureSubscription: ${{ parameters.azureServiceConnection }}
                        appName: $(apiAppName)
                        resourceGroupName: $(appResourceGroup)
                        slotName: ${{ parameters.deploymentSlot }}
                        appSettings: $(appSettingsJson)

                    - task: AzureWebApp@1
                      displayName: "Deploy API to the ${{ parameters.deploymentSlot }} slot"
                      inputs:
                        azureSubscription: ${{ parameters.azureServiceConnection }}
                        appType: webAppLinux
                        appName: $(apiAppName)
                        deployToSlotOrASE: true
                        resourceGroupName: $(appResourceGroup)
                        slotName: ${{ parameters.deploymentSlot }}
                        package: $(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.apiPackageFolder }}/*.zip
                        deploymentMethod: zipDeploy

                    - script: |
                        curl --fail --silent --show-error --location --max-time 30 \
                          --retry 5 --retry-delay 10 --retry-all-errors \
                          --output /dev/null --write-out "HTTP %{http_code} from ${SMOKE_URL}\n" \
                          ${SMOKE_INSECURE} "${SMOKE_URL}"
                      displayName: "Check that the ${{ parameters.deploymentSlot }} slot responds"
                      env:
                        SMOKE_URL: $(slotSmokeTestUrl)
                        ${{ if eq(parameters.smokeTestAllowSelfSignedCertificate, true) }}:
                          SMOKE_INSECURE: "--insecure"

                    - task: AzureAppServiceManage@0
                      displayName: "Swap ${{ parameters.deploymentSlot }} slot into production"
                      inputs:
                        azureSubscription: ${{ parameters.azureServiceConnection }}
                        Action: "Swap Slots"
                        WebAppName: $(apiAppName)
                        ResourceGroupName: $(appResourceGroup)
                        SourceSlot: ${{ parameters.deploymentSlot }}
                        SwapWithProduction: true

                - ${{ if eq(parameters.deploymentSlot, 'none') }}:
                    - task: AzureAppServiceSettings@1
                      displayName: "Apply application settings to App Service"
                      inputs:
                        azureSubscription: ${{ parameters.azureServiceConnection }}
                        appName: $(apiAppName)
                        resourceGroupName: $(appResourceGroup)
                        appSettings: $(appSettingsJson)

                    - task: AzureWebApp@1
                      displayName: "Deploy API to App Service"
                      inputs:
                        azureSubscription: ${{ parameters.azureServiceConnection }}
                        appType: webAppLinux
                        appName: $(apiAppName)
                        package: $(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.apiPackageFolder }}/*.zip
                        deploymentMethod: zipDeploy

      - job: SmokeTest_${{ parameters.environment }}
        displayName: "Check that the application responds in ${{ upper(parameters.environment) }}"
        timeoutInMinutes: 10
        dependsOn: DeployApp_${{ parameters.environment }}
        variables:
          - group: ${{ parameters.variableGroup }}
        steps:
          - checkout: none
          - script: |
              curl --fail --silent --show-error --location --max-time 30 \
                --retry 5 --retry-delay 10 --retry-all-errors \
                --output /dev/null --write-out "HTTP %{http_code} from ${SMOKE_URL}\n" \
                ${SMOKE_INSECURE} "${SMOKE_URL}"
            displayName: "Call the application address"
            env:
              SMOKE_URL: $(smokeTestUrl)
              ${{ if eq(parameters.smokeTestAllowSelfSignedCertificate, true) }}:
                SMOKE_INSECURE: "--insecure"
