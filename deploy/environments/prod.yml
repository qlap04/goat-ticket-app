# Application values for the prod environment.
# MOCK: every environment currently delivers to the dev resources and the dev settings.
# When a real environment exists, change only the values below. The template is not touched.
#
# Slot delivery is off until the infrastructure creates a fully configured slot
# (same settings, VNet integration and identity as production). To switch it on, change two values:
#   deploymentSlot: staging
#   slotEnvironmentName: goat-prod-slot      (create this Environment, with no approval)

parameters:
  # Position in the pipeline, passed through from azure-pipelines-app.yml.
  - name: dependsOn
    type: object
  - name: previousStage
    type: string
  - name: branchMatch
    type: string
  - name: hotfixEnvironment
    type: string
  - name: deployInfraAll
    type: boolean

stages:
  - template: ../templates/deploy-env-stage.yml
    parameters:
      environment: prod
      displayName: production
      environmentName: goat-prod
      infraJobName: InfraDeploy_prod
      deploymentSlot: none
      slotEnvironmentName: none
      azureServiceConnection: goat-ticket-connection
      resourceGroup: rg-goat-app-dev
      apiAppName: app-goat-api-dev
      functionAppName: func-goat-worker-dev
      variableGroup: goat-app-dev
      smokeTestUrl: https://goatticket.kaidevops.online/swagger/index.html
      smokeTestAllowSelfSignedCertificate: true
      dependsOn: ${{ parameters.dependsOn }}
      previousStage: ${{ parameters.previousStage }}
      branchMatch: ${{ parameters.branchMatch }}
      hotfixEnvironment: ${{ parameters.hotfixEnvironment }}
      deployInfraAll: ${{ parameters.deployInfraAll }}