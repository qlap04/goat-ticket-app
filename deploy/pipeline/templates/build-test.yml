parameters:
  - name: testSecrets
    type: object
    default:
      - variableName: ticketQrSigningKeyPem
        envName: Signing__TicketQrSigningKeyPem
      - variableName: jwtSigningKey
        envName: Jwt__SigningKey
      - variableName: mockExternalApiKey
        envName: ExternalApi__ApiKey

jobs:
  - job: BuildAndTest
    displayName: "Build, check and unit test"
    steps:
      - checkout: self
        fetchDepth: 1

      #Restore and Build 
      - task: UseDotNet@2
        displayName: "Install .NET SDK"
        inputs:
          packageType: sdk
          version: 8.x

      - task: DotNetCoreCLI@2
        displayName: "Build solution"
        inputs:
          command: build
          projects: GoatTicket.sln
          arguments: --configuration Release

      #Validate code
      - task: DotNetCoreCLI@2
        displayName: "Check code formatting"
        inputs:
          command: custom
          custom: format
          arguments: GoatTicket.sln --verify-no-changes

      #Security Scan
      - task: DotNetCoreCLI@2
        displayName: "Check vulnerabilities"
        inputs:
          command: custom
          custom: list
          arguments: GoatTicket.sln package --vulnerable --include-transitive

      - task: MicrosoftSecurityDevOps@1
        displayName: "Scan credentials"
        inputs:
          tools: credscan
          categories: code
          break: false
          publish: true


      # Run multi-unit test
      - task: DotNetCoreCLI@2
        displayName: "Run unit tests"
        inputs:
          command: test
          projects: tests/**/*UnitTests.csproj
          arguments: --configuration Release

        #Publish package
      - task: DotNetCoreCLI@2
        displayName: "Package API"
        inputs:
          command: publish
          publishWebProjects: false
          projects: src/GoatTicket.Api/GoatTicket.Api.csproj
          arguments: --configuration Release --output $(Build.ArtifactStagingDirectory)/api
          modifyOutputPath: false

      - task: DotNetCoreCLI@2
        displayName: "Package Function App"
        inputs:
          command: publish
          publishWebProjects: false
          projects: src/GoatTicket.Functions/GoatTicket.Functions.csproj
          arguments: --configuration Release --output $(Build.ArtifactStagingDirectory)/func
          modifyOutputPath: false

      - publish: $(Build.ArtifactStagingDirectory)
        artifact: drop
        displayName: "Publish build artifact"

  #Integration test
  - job: IntegrationTests
    displayName: "Integration tests"
    variables:
      - group: goat-app-integration
    steps:
      - checkout: self
        fetchDepth: 1

      - script: |
          docker system prune -a --volumes -f
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache
          df -h /
        displayName: "Free disk"

      - task: UseDotNet@2
        displayName: "Install .NET SDK"
        inputs:
          packageType: sdk
          version: 8.x

      - task: DotNetCoreCLI@2
        displayName: "Run container tests"
        # A failed run ends yellow (succeeded with issues), not red: the emulators flake on a small agent
        continueOnError: true
        env:
          ${{ each secret in parameters.testSecrets }}:
            ${{ secret.envName }}: $(${{ secret.variableName }})
        inputs:
          command: test
          projects: |
            tests/GoatTicket.ContractTests/GoatTicket.ContractTests.csproj
            tests/GoatTicket.IntegrationTests/GoatTicket.IntegrationTests.csproj
          arguments: --configuration Release
