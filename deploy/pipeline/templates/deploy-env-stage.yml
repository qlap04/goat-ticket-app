parameters:
  - name: environment
    type: string

  - name: deploymentSlot
    type: string
    default: none
    values:
      - none
      - staging

  - name: hotfixEnv
    type: string

  - name: deployInfraAll
    type: boolean

  - name: deployNetwork
    type: boolean

stages:
  - stage: Deploy_${{ parameters.environment }}
    displayName: "Deliver to ${{ upper(parameters.environment) }}"
    #Run conditions
    condition: >-
      and(
        in(dependencies[variables['previousStage_${{ parameters.environment }}']].result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
        ne(variables['Build.Reason'], 'PullRequest'),
        or(
          startsWith(variables['Build.SourceBranch'], variables['branch_${{ parameters.environment }}']),
          and(
            startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'),
            le(variables['envOrder_${{ parameters.hotfixEnv }}'], variables['envOrder_${{ parameters.environment }}'])
          )
        )
      )
    #Groups for all jobs
    variables:
      - template: ../../variables/environment-variables.yml
        parameters:
          environment: ${{ parameters.environment }}
    jobs:
      #Deploy Infra
      - ${{ if eq(parameters.deployInfraAll, true) }}:
          - template: deploy/pipeline/templates/deploy-infra-jobs.yml@InfraRepo
            parameters:
              environment: ${{ parameters.environment }}
              repository: InfraRepo
              deployNetwork: ${{ parameters.deployNetwork }}
              abcobject:
                owner: goat-team

      #Deploy App and Func
      - deployment: DeployApp_${{ parameters.environment }}
        displayName: "Deploy application to ${{ upper(parameters.environment) }}"
        # Self-hosted agent inside the VNet: the web app and the vault accept private traffic only
        pool:
          name: goat-agents

        # Check deploy infra all
        ${{ if eq(parameters.deployInfraAll, true) }}:
          dependsOn: InfraDeploy_${{ parameters.environment }}
        environment: goat-${{ parameters.environment }}
        variables:
          - template: ../../variables/environment-variables.yml
            parameters:
              environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                #Get artifact
                - download: current
                  artifact: drop
                
                #Deploy Function
                - task: AzureAppServiceSettings@1
                  displayName: "Apply worker settings"
                  inputs:
                    azureSubscription: ${{ variables.armConnection }}
                    appName: $(functionAppName)
                    resourceGroupName: $(appResourceGroup)
                    appSettings: $(functionAppSettingsJson)

                - task: AzureFunctionApp@2
                  displayName: "Deploy worker"
                  inputs:
                    azureSubscription: ${{ variables.armConnection }}
                    appType: functionAppLinux
                    appName: $(functionAppName)
                    package: $(Pipeline.Workspace)/drop/func/*.zip
                    deploymentMethod: zipDeploy

                #Deploy API
                - task: AzureAppServiceSettings@1
                  displayName: "Apply API settings"
                  inputs:
                    azureSubscription: ${{ variables.armConnection }}
                    appName: $(apiAppName)
                    resourceGroupName: $(appResourceGroup)
                    ${{ if ne(parameters.deploymentSlot, 'none') }}:
                      slotName: ${{ parameters.deploymentSlot }}
                    appSettings: $(appSettingsJson)

                - task: AzureWebApp@1
                  displayName: "Deploy API"
                  inputs:
                    azureSubscription: ${{ variables.armConnection }}
                    appType: webAppLinux
                    appName: $(apiAppName)
                    ${{ if ne(parameters.deploymentSlot, 'none') }}:
                      deployToSlotOrASE: true
                      resourceGroupName: $(appResourceGroup)
                      slotName: ${{ parameters.deploymentSlot }}
                    package: $(Pipeline.Workspace)/drop/api/*.zip
                    deploymentMethod: zipDeploy

                #Slot only
                - ${{ if ne(parameters.deploymentSlot, 'none') }}:
                    - script: |
                        curl --fail --silent --show-error --location --max-time 30 \
                          --retry 5 --retry-delay 10 --retry-all-errors \
                          --output /dev/null --write-out "HTTP %{http_code} from ${SMOKE_URL}\n" \
                          --insecure "${SMOKE_URL}"
                      displayName: "Check slot"
                      env:
                        SMOKE_URL: $(slotSmokeTestUrl)

                    - task: AzureAppServiceManage@0
                      displayName: "Swap slot"
                      inputs:
                        azureSubscription: ${{ variables.armConnection }}
                        Action: "Swap Slots"
                        WebAppName: $(apiAppName)
                        ResourceGroupName: $(appResourceGroup)
                        SourceSlot: ${{ parameters.deploymentSlot }}
                        SwapWithProduction: true
