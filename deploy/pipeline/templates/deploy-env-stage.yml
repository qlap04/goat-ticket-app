parameters:
  - name: environment
    type: string
    values:
      - dev
      - sit
      - uat
      - preprod
      - prod

  - name: environmentName
    type: string

  - name: previousStage
    type: string

  - name: branchMatch
    type: string

  - name: deploymentSlot
    type: string
    values:
      - none
      - staging

  - name: hotfixEnvironment
    type: string
    values:
      - dev
      - sit
      - uat
      - preprod

  - name: deployInfraAll
    type: boolean

  - name: createKeyVaultSecrets
    type: boolean

stages:
  - stage: Deploy_${{ parameters.environment }}
    displayName: "Deliver to ${{ upper(parameters.environment) }}"
    dependsOn:
      - Build
      - ${{ if ne(parameters.previousStage, 'Build') }}:
          - ${{ parameters.previousStage }}
    condition: >-
      and(
        ne(variables['Build.Reason'], 'PullRequest'),
        in(dependencies.Build.result, 'Succeeded', 'SucceededWithIssues'),
        in(dependencies.${{ parameters.previousStage }}.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
        or(
          ${{ parameters.branchMatch }},
          and(
            startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'),
            eq('${{ parameters.hotfixEnvironment }}', '${{ parameters.environment }}')
          )
        )
      )
    jobs:
      - ${{ if eq(parameters.deployInfraAll, true) }}:
          - template: deploy/pipeline/templates/deploy-infra-jobs.yml@InfraRepo
            parameters:
              environment: ${{ parameters.environment }}
              environmentName: ${{ parameters.environmentName }}
              repository: InfraRepo

      - deployment: DeployApp_${{ parameters.environment }}
        displayName: "Deploy application to ${{ upper(parameters.environment) }}"
        timeoutInMinutes: 45
        ${{ if eq(parameters.deployInfraAll, true) }}:
          dependsOn: InfraDeploy_${{ parameters.environment }}
        environment: ${{ parameters.environmentName }}
        variables:
          - group: goat-app-dev
          - group: goat-ticket-secrets-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - ${{ if eq(parameters.createKeyVaultSecrets, true) }}:
                    - task: AzureCLI@2
                      displayName: "Write Signing--TicketQrSigningKeyPem to Key Vault"
                      inputs:
                        azureSubscription: goat-ticket-connection
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: |
                          az keyvault secret set \
                            --vault-name "$KEY_VAULT_NAME" \
                            --name "Signing--TicketQrSigningKeyPem" \
                            --value "$SECRET_VALUE" \
                            --output none
                      env:
                        KEY_VAULT_NAME: $(keyVaultName)
                        SECRET_VALUE: $(ticketQrSigningKeyValue)

                - task: AzureAppServiceSettings@1
                  displayName: "Apply application settings to Function App"
                  inputs:
                    azureSubscription: goat-ticket-connection
                    appName: $(functionAppName)
                    resourceGroupName: $(appResourceGroup)
                    appSettings: $(functionAppSettingsJson)

                - task: AzureFunctionApp@2
                  displayName: "Deploy worker to Function App"
                  inputs:
                    azureSubscription: goat-ticket-connection
                    appType: functionAppLinux
                    appName: $(functionAppName)
                    package: $(Pipeline.Workspace)/drop/func/*.zip
                    deploymentMethod: zipDeploy

                - ${{ if ne(parameters.deploymentSlot, 'none') }}:
                    - task: AzureAppServiceSettings@1
                      displayName: "Apply application settings to the ${{ parameters.deploymentSlot }} slot"
                      inputs:
                        azureSubscription: goat-ticket-connection
                        appName: $(apiAppName)
                        resourceGroupName: $(appResourceGroup)
                        slotName: ${{ parameters.deploymentSlot }}
                        appSettings: $(appSettingsJson)

                    - task: AzureWebApp@1
                      displayName: "Deploy API to the ${{ parameters.deploymentSlot }} slot"
                      inputs:
                        azureSubscription: goat-ticket-connection
                        appType: webAppLinux
                        appName: $(apiAppName)
                        deployToSlotOrASE: true
                        resourceGroupName: $(appResourceGroup)
                        slotName: ${{ parameters.deploymentSlot }}
                        package: $(Pipeline.Workspace)/drop/api/*.zip
                        deploymentMethod: zipDeploy

                    - script: |
                        curl --fail --silent --show-error --location --max-time 30 \
                          --retry 5 --retry-delay 10 --retry-all-errors \
                          --output /dev/null --write-out "HTTP %{http_code} from ${SMOKE_URL}\n" \
                          --insecure "${SMOKE_URL}"
                      displayName: "Check that the ${{ parameters.deploymentSlot }} slot responds"
                      env:
                        SMOKE_URL: $(slotSmokeTestUrl)

                    - task: AzureAppServiceManage@0
                      displayName: "Swap ${{ parameters.deploymentSlot }} slot into production"
                      inputs:
                        azureSubscription: goat-ticket-connection
                        Action: "Swap Slots"
                        WebAppName: $(apiAppName)
                        ResourceGroupName: $(appResourceGroup)
                        SourceSlot: ${{ parameters.deploymentSlot }}
                        SwapWithProduction: true

                - ${{ if eq(parameters.deploymentSlot, 'none') }}:
                    - task: AzureAppServiceSettings@1
                      displayName: "Apply application settings to App Service"
                      inputs:
                        azureSubscription: goat-ticket-connection
                        appName: $(apiAppName)
                        resourceGroupName: $(appResourceGroup)
                        appSettings: $(appSettingsJson)

                    - task: AzureWebApp@1
                      displayName: "Deploy API to App Service"
                      inputs:
                        azureSubscription: goat-ticket-connection
                        appType: webAppLinux
                        appName: $(apiAppName)
                        package: $(Pipeline.Workspace)/drop/api/*.zip
                        deploymentMethod: zipDeploy

      - job: SmokeTest_${{ parameters.environment }}
        displayName: "Check that the application responds in ${{ upper(parameters.environment) }}"
        timeoutInMinutes: 10
        dependsOn: DeployApp_${{ parameters.environment }}
        variables:
          - group: goat-app-dev
        steps:
          - checkout: none
          - script: |
              curl --fail --silent --show-error --location --max-time 30 \
                --retry 5 --retry-delay 10 --retry-all-errors \
                --output /dev/null --write-out "HTTP %{http_code} from ${SMOKE_URL}\n" \
                --insecure "${SMOKE_URL}"
            displayName: "Call the application address"
            env:
              SMOKE_URL: $(smokeTestUrl)
