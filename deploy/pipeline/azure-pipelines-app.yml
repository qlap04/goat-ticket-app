name: "App Delivery - $(Build.SourceBranchName) - $(Date:yyyyMMdd)$(Rev:.r)"

trigger: none

pr:
  branches:
    include:
      - develop
      - main
      - release/*

parameters:
  - name: deployInfraAll
    displayName: "Deploy infrastructure before the application"
    type: boolean
    default: false

  - name: createKeyVaultSecrets
    displayName: "Write application secrets to Key Vault from the variable group"
    type: boolean
    default: false

  - name: hotfixEnvironment
    displayName: "Hotfix branches only: environment to deliver to"
    type: string
    default: dev
    values:
      - dev
      - sit
      - uat
      - preprod

resources:
  repositories:
    - repository: InfraRepo
      type: github
      name: qlap04/goat-ticket-infra
      ref: refs/tags/infra-templates-v1.2.1
      endpoint: qlap04

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Build
    displayName: "Build and test application"
    jobs:
      - template: templates/build-test.yml

  - template: templates/environments.yml
    parameters:
      hotfixEnvironment: ${{ parameters.hotfixEnvironment }}
      deployInfraAll: ${{ parameters.deployInfraAll }}
      createKeyVaultSecrets: ${{ parameters.createKeyVaultSecrets }}
