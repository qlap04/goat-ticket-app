name: "App Delivery - $(Build.SourceBranchName) - $(Date:yyyyMMdd)$(Rev:.r)"

trigger: none

parameters:
  - name: deployInfraAll
    displayName: "Deploy Infra"
    type: boolean
    default: false

  - name: deployNetwork
    displayName: "Deploy network"
    type: boolean
    default: false

  - name: createKeyVaultSecrets
    displayName: "Write vault secrets"
    type: boolean
    default: false

  - name: hotfixEnv
    displayName: "Hotfix environment"
    type: string
    default: dev
    values:
      - dev
      - sit
      - uat
      - preprod

resources:
  repositories:
    - repository: InfraRepo
      type: github
      name: qlap04/goat-ticket-infra
      ref: refs/tags/infra-templates-v3.0.0
      endpoint: qlap04

pool:
  vmImage: ubuntu-24.04

variables:
  branch_dev: refs/heads/develop
  branch_sit: refs/heads/release/
  branch_uat: refs/heads/release/
  branch_preprod: refs/heads/main
  branch_prod: refs/heads/main

stages:
  - stage: Build
    displayName: "Build and test"
    jobs:
      - template: templates/build-test.yml

  #DEV
  - template: templates/deploy-env-stage.yml
    parameters:
      environment: dev
      hotfixEnv: ${{ parameters.hotfixEnv }}
      deployInfraAll: ${{ parameters.deployInfraAll }}
      deployNetwork: ${{ parameters.deployNetwork }}
      createKeyVaultSecrets: ${{ parameters.createKeyVaultSecrets }}

  #SIT
  - template: templates/deploy-env-stage.yml
    parameters:
      environment: sit
      hotfixEnv: ${{ parameters.hotfixEnv }}
      deployInfraAll: ${{ parameters.deployInfraAll }}
      deployNetwork: ${{ parameters.deployNetwork }}
      createKeyVaultSecrets: ${{ parameters.createKeyVaultSecrets }}

  #UAT
  - template: templates/deploy-env-stage.yml
    parameters:
      environment: uat
      hotfixEnv: ${{ parameters.hotfixEnv }}
      deployInfraAll: ${{ parameters.deployInfraAll }}
      deployNetwork: ${{ parameters.deployNetwork }}
      createKeyVaultSecrets: ${{ parameters.createKeyVaultSecrets }}

  #PREPROD
  - template: templates/deploy-env-stage.yml
    parameters:
      environment: preprod
      hotfixEnv: ${{ parameters.hotfixEnv }}
      deployInfraAll: ${{ parameters.deployInfraAll }}
      deployNetwork: ${{ parameters.deployNetwork }}
      createKeyVaultSecrets: ${{ parameters.createKeyVaultSecrets }}

  #PROD
  - template: templates/deploy-env-stage.yml
    parameters:
      environment: prod
      hotfixEnv: ${{ parameters.hotfixEnv }}
      deployInfraAll: ${{ parameters.deployInfraAll }}
      deployNetwork: ${{ parameters.deployNetwork }}
      createKeyVaultSecrets: ${{ parameters.createKeyVaultSecrets }}
