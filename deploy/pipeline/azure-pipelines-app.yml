name: "App Delivery - $(Build.SourceBranchName) - $(Date:yyyyMMdd)$(Rev:.r)"

trigger: none

parameters:
  - name: deployInfraAll
    displayName: "Deploy Infra"
    type: boolean
    default: false

  - name: deployNetwork
    displayName: "Deploy network"
    type: boolean
    default: false

  - name: createKeyVaultSecrets
    displayName: "Write vault secrets"
    type: boolean
    default: false

  - name: hotfixEnv
    displayName: "Hotfix start"
    type: string
    default: dev
    values:
      - dev
      - sit
      - uat
      - preprod

resources:
  repositories:
    - repository: InfraRepo
      type: github
      name: qlap04/goat-ticket-infra
      ref: refs/tags/infra-templates-v3.0.1
      endpoint: qlap04

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Build
    displayName: "Build and test"
    jobs:
      - template: templates/build-test.yml

  #Vault secrets, written once for the whole run. Each name is both the Key Vault secret and the variable in the secrets group.
  - stage: Vault
    displayName: "Write vault secrets"
    condition: and(in(dependencies.Build.result, 'Succeeded', 'SucceededWithIssues'), eq('${{ parameters.createKeyVaultSecrets }}', 'True'))
    jobs:
      - job: WriteSecrets
        displayName: "Write secrets to vault"
        # Self-hosted agent inside the VNet: the vault accepts private traffic only
        pool:
          name: goat-agents
        variables:
          - template: ../variables/environment-variables.yml
            parameters:
              environment: dev
          - group: goat-ticket-secrets-dev
        steps:
          - task: AzureCLI@2
            displayName: "Write vault secrets"
            inputs:
              azureSubscription: ${{ variables.armConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # Every variable named KVSECRET_<name> becomes one secret; "__" in <name> stands for "--"
                for var in $(compgen -e | grep '^KVSECRET_'); do
                  name="${var#KVSECRET_}"; name="${name//__/--}"
                  if [ -z "${!var}" ]; then echo "Secret value for $name is empty" >&2; exit 1; fi
                  az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name "$name" --value "${!var}" --output none
                done
            env:
              KEY_VAULT_NAME: $(keyVaultName)
              KVSECRET_Signing__TicketQrSigningKeyPem: $(Signing--TicketQrSigningKeyPem)
              KVSECRET_Jwt__SigningKey: $(Jwt--SigningKey)

  #DEV
  - template: templates/deploy-env-stage.yml
    parameters:
      environment: dev
      hotfixEnv: ${{ parameters.hotfixEnv }}
      deployInfraAll: ${{ parameters.deployInfraAll }}
      deployNetwork: ${{ parameters.deployNetwork }}

  #SIT
  - template: templates/deploy-env-stage.yml
    parameters:
      environment: sit
      hotfixEnv: ${{ parameters.hotfixEnv }}
      deployInfraAll: ${{ parameters.deployInfraAll }}
      deployNetwork: ${{ parameters.deployNetwork }}

  #UAT
  - template: templates/deploy-env-stage.yml
    parameters:
      environment: uat
      hotfixEnv: ${{ parameters.hotfixEnv }}
      deployInfraAll: ${{ parameters.deployInfraAll }}
      deployNetwork: ${{ parameters.deployNetwork }}

  #PREPROD
  - template: templates/deploy-env-stage.yml
    parameters:
      environment: preprod
      hotfixEnv: ${{ parameters.hotfixEnv }}
      deployInfraAll: ${{ parameters.deployInfraAll }}
      deployNetwork: ${{ parameters.deployNetwork }}

  #PROD
  - template: templates/deploy-env-stage.yml
    parameters:
      environment: prod
      hotfixEnv: ${{ parameters.hotfixEnv }}
      deployInfraAll: ${{ parameters.deployInfraAll }}
      deployNetwork: ${{ parameters.deployNetwork }}
