parameters:
  - name: environment
    type: string

  # API settings, written as a list and sent as JSON
  - name: apiSettings
    type: object
    default:
      - name: ASPNETCORE_ENVIRONMENT
        value: Production
        slotSetting: false
      - name: AppConfiguration__Endpoint
        value: https://appcs-goat-dev-cr7.azconfig.io
        slotSetting: false
      - name: AppConfiguration__Label
        value: dev
        slotSetting: false

  # Worker settings, same shape
  - name: workerSettings
    type: object
    default:
      - name: AZURE_FUNCTIONS_ENVIRONMENT
        value: Production
        slotSetting: false
      - name: AppConfiguration__Endpoint
        value: https://appcs-goat-dev-cr7.azconfig.io
        slotSetting: false
      - name: AppConfiguration__Label
        value: dev
        slotSetting: false

# Per-environment values only. Variable groups hold secrets, nothing else. The mock runs every
# environment on the dev resources, so only prod has its own branch.
variables:
  - ${{ if eq(parameters.environment, 'prod') }}:
      - name: armConnection
        value: goat-ticket-connection
      - name: apiAppName
        value: app-goat-api-dev-cr7
      - name: functionAppName
        value: func-goat-worker-dev-cr7
      - name: appResourceGroup
        value: rg-goat-app-dev
      - name: keyVaultName
        value: kv-goat-dev-cr7
      - name: slotSmokeTestUrl
        value: https://app-goat-api-dev-cr7-staging.azurewebsites.net/swagger/index.html
      # Mock: prod shares the dev secrets, the prod group does not exist
      - group: goat-ticket-secrets-dev
  - ${{ else }}:
      - name: armConnection
        value: goat-ticket-connection
      - name: apiAppName
        value: app-goat-api-dev-cr7
      - name: functionAppName
        value: func-goat-worker-dev-cr7
      - name: appResourceGroup
        value: rg-goat-app-dev
      - name: keyVaultName
        value: kv-goat-dev-cr7
      - name: slotSmokeTestUrl
        value: https://app-goat-api-dev-cr7-staging.azurewebsites.net/swagger/index.html
      - group: goat-ticket-secrets-dev

  - name: appSettingsJson
    value: ${{ convertToJson(parameters.apiSettings) }}
  - name: functionAppSettingsJson
    value: ${{ convertToJson(parameters.workerSettings) }}

  # Branch each environment is delivered from; the stage condition reads these
  - name: branch_dev
    value: refs/heads/develop
  - name: branch_sit
    value: refs/heads/release/
  - name: branch_uat
    value: refs/heads/release/
  - name: branch_preprod
    value: refs/heads/main
  - name: branch_prod
    value: refs/heads/main

  # Stage that runs right before each environment; a skipped one is accepted, so a release branch reaches SIT without DEV
  - name: previousStage_dev
    value: Build
  - name: previousStage_sit
    value: Deploy_dev
  - name: previousStage_uat
    value: Deploy_sit
  - name: previousStage_preprod
    value: Deploy_uat
  - name: previousStage_prod
    value: Deploy_preprod

  # Position of each environment in the delivery order; a hotfix runs every stage from the one it starts at on to PROD
  - name: envOrder_dev
    value: 1
  - name: envOrder_sit
    value: 2
  - name: envOrder_uat
    value: 3
  - name: envOrder_preprod
    value: 4
  - name: envOrder_prod
    value: 5
