name: "App Demo Deploy - $(Build.SourceBranchName)"

trigger: none

pool:
  vmImage: "ubuntu-latest"

parameters:
  - name: deployInfraFirst
    displayName: "Deploy infrastructure before deploying the app?"
    type: boolean
    default: false

resources:
  repositories:
    - repository: InfraRepo
      type: github
      name: qlap04/goat-ticket-infra
      ref: dev
      endpoint: "qlap04"

variables:
  - group: goat-ticket-secrets-dev

stages:
  # ===== STAGE 1: DEPLOY INFRA (OPTIONAL, toggle = true) =====
  - stage: DeployInfra
    displayName: "Deploy infrastructure"
    condition: eq('${{ parameters.deployInfraFirst }}', 'true')
    jobs:
      - job: DeployInfraJob
        steps:
          - checkout: self
          - checkout: InfraRepo

          - template: deploy/templates/deploy-infra.yml@InfraRepo
            parameters:
              environment: dev

  # ===== STAGE 2: DEPLOY CODE  =====
  - stage: DeployCode
    displayName: "Deploy application code"
    dependsOn: DeployInfra
    condition: always()
    jobs:
      - job: BuildAndDeploy
        steps:
          - checkout: self

          - task: UseDotNet@2
            inputs:
              packageType: "sdk"
              version: "8.x"
            displayName: "Install .NET 8 SDK"

          - template: deploy/templates/common.yml

          - task: DotNetCoreCLI@2
            displayName: "Publish API"
            inputs:
              command: "publish"
              publishWebProjects: false
              projects: "src/GoatTicket.Api/GoatTicket.Api.csproj"
              arguments: "--configuration Release --output $(Build.ArtifactStagingDirectory)/api"
              zipAfterPublish: true
              modifyOutputPath: false

          - task: DotNetCoreCLI@2
            displayName: "Publish Function"
            inputs:
              command: "publish"
              publishWebProjects: false
              projects: "src/GoatTicket.Functions/GoatTicket.Functions.csproj"
              arguments: "--configuration Release --output $(Build.ArtifactStagingDirectory)/func"
              zipAfterPublish: true
              modifyOutputPath: false

          - task: AzureWebApp@1
            displayName: "Deploy App Service"
            inputs:
              azureSubscription: "goat-ticket-connection"
              appType: "webAppLinux"
              appName: "app-goat-api-dev"
              package: "$(Build.ArtifactStagingDirectory)/api/*.zip"
              deploymentMethod: "zipDeploy"

          - task: AzureFunctionApp@2
            displayName: "Deploy Function App"
            inputs:
              azureSubscription: "goat-ticket-connection"
              appType: "functionAppLinux"
              appName: "func-goat-worker-dev"
              package: "$(Build.ArtifactStagingDirectory)/func/*.zip"
              deploymentMethod: "zipDeploy"
