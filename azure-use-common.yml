name: "Demo Pipeline - Deploy Infra from App Repo"

trigger: none

pool:
  vmImage: "ubuntu-latest"

resources:
  repositories:
    - repository: InfraRepo
      type: github
      name: qlap04/goat-ticket-infra
      ref: dev
      endpoint: "qlap04"

variables:
  - group: goat-ticket-secrets-dev

steps:
  - checkout: self
  - checkout: InfraRepo

  - template: deploy/templates/deploy-infra.yml@InfraRepo
    parameters:
      environment: dev
