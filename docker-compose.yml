name: goat-ticket

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Apple Silicon note: this image is amd64-only; Docker Desktop runs it under
    # emulation. If that's too slow locally, swap in mcr.microsoft.com/azure-sql-edge:latest
    # (arm64-native, SQL-Server-wire-compatible) for local dev only.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    # Apple Silicon note: the classic emulator is amd64-only. If unavailable/too slow
    # under emulation, use the vnext preview image (mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator-vnext)
    # which has native arm64 support, per Microsoft's current preview docs.
    platform: linux/amd64
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: "10"
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "false"
    ports:
      - "8081:8081"
      - "10250-10255:10250-10255"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose"
    ports:
      - "10000:10000" # Blob
      - "10001:10001" # Queue
      - "10002:10002" # Table
    volumes:
      - azurite-data:/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  sql-data:
  azurite-data:
