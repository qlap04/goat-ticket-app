name: "App Delivery - $(Build.SourceBranchName) - $(Date:yyyyMMdd)$(Rev:.r)"

trigger:
  branches:
    include:
      - develop
      - main
      - release/*
      - hotfix/*

pr: none

parameters:
  - name: deployInfraAll
    displayName: "Deploy infrastructure before the application (every active environment)"
    type: boolean
    default: false
  - name: hotfixEnvironment
    displayName: "Hotfix branches only: target environment"
    type: string
    default: dev
    values: [dev, sit, uat, preprod, prod]

resources:
  repositories:
    - repository: InfraRepo
      type: github
      name: qlap04/goat-ticket-infra
      ref: dev
      endpoint: qlap04

pool:
  vmImage: ubuntu-latest

variables:
  - group: goat-ticket-secrets-dev

stages:
  # BUILD & TEST
  - stage: Build
    displayName: "Build and test application"
    jobs:
      - job: BuildAndTest
        displayName: "Build, check and unit test"
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: "Install .NET 8 SDK"
            inputs:
              packageType: sdk
              version: 8.x

          - task: DotNetCoreCLI@2
            displayName: "Restore packages"
            inputs:
              command: restore
              projects: GoatTicket.sln

          - task: DotNetCoreCLI@2
            displayName: "Build solution"
            inputs:
              command: build
              projects: GoatTicket.sln
              arguments: --configuration Release --no-restore

          - task: DotNetCoreCLI@2
            displayName: "Check code formatting"
            inputs:
              command: custom
              custom: format
              arguments: GoatTicket.sln --verify-no-changes

          - task: DotNetCoreCLI@2
            displayName: "Check packages for known vulnerabilities"
            inputs:
              command: custom
              custom: list
              arguments: GoatTicket.sln package --vulnerable --include-transitive

          - task: MicrosoftSecurityDevOps@1
            displayName: "Scan code for exposed credentials"
            inputs:
              tools: credscan
              categories: code
              break: false
              publish: true

          - task: DotNetCoreCLI@2
            displayName: "Run unit tests"
            inputs:
              command: test
              projects: tests/GoatTicket.UnitTests/GoatTicket.UnitTests.csproj
              arguments: --configuration Release

          - task: DotNetCoreCLI@2
            displayName: "Package API"
            inputs:
              command: publish
              publishWebProjects: false
              projects: src/GoatTicket.Api/GoatTicket.Api.csproj
              arguments: --configuration Release --output $(Build.ArtifactStagingDirectory)/api
              zipAfterPublish: true
              modifyOutputPath: false

          - task: DotNetCoreCLI@2
            displayName: "Package Function App"
            inputs:
              command: publish
              publishWebProjects: false
              projects: src/GoatTicket.Functions/GoatTicket.Functions.csproj
              arguments: --configuration Release --output $(Build.ArtifactStagingDirectory)/func
              zipAfterPublish: true
              modifyOutputPath: false

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: drop
            displayName: "Publish build artifact"

      - job: IntegrationTests
        displayName: "Run integration tests against containers"
        steps:
          - checkout: self
          # This cleanup removes preinstalled SDKs, so it must stay on its own agent
          - script: |
              docker system prune -a --volumes -f
              sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache
              df -h /
            displayName: "Free disk space on the agent"

          - task: UseDotNet@2
            displayName: "Install .NET 8 SDK"
            inputs:
              packageType: sdk
              version: 8.x

          - task: DotNetCoreCLI@2
            displayName: "Run integration tests"
            continueOnError: true
            inputs:
              command: test
              projects: tests/GoatTicket.IntegrationTests/GoatTicket.IntegrationTests.csproj
              arguments: --configuration Release
              

  # DEPLOY
  - template: deploy/templates/deploy-env-stage.yml
    parameters:
      environment: dev
      displayName: "development"
      target: dev
      dependsOn: [Build]
      previousStage: Build
      branchMatch: "eq(variables['Build.SourceBranch'], 'refs/heads/develop')"
      hotfixEnvironment: ${{ parameters.hotfixEnvironment }}
      deployInfraAll: ${{ parameters.deployInfraAll }}

  - template: deploy/templates/deploy-env-stage.yml
    parameters:
      environment: sit
      displayName: "system integration testing (SIT)"
      target: dev
      dependsOn: [Build, Deploy_dev]
      previousStage: Deploy_dev
      branchMatch: "startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')"
      hotfixEnvironment: ${{ parameters.hotfixEnvironment }}
      deployInfraAll: ${{ parameters.deployInfraAll }}

  - template: deploy/templates/deploy-env-stage.yml
    parameters:
      environment: uat
      displayName: "user acceptance testing (UAT)"
      target: dev
      dependsOn: [Build, Deploy_sit]
      previousStage: Deploy_sit
      branchMatch: "startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')"
      hotfixEnvironment: ${{ parameters.hotfixEnvironment }}
      deployInfraAll: ${{ parameters.deployInfraAll }}

  - template: deploy/templates/deploy-env-stage.yml
    parameters:
      environment: preprod
      displayName: "pre-production"
      target: dev
      dependsOn: [Build, Deploy_uat]
      previousStage: Deploy_uat
      branchMatch: "eq(variables['Build.SourceBranch'], 'refs/heads/main')"
      hotfixEnvironment: ${{ parameters.hotfixEnvironment }}
      deployInfraAll: ${{ parameters.deployInfraAll }}

  - template: deploy/templates/deploy-env-stage.yml
    parameters:
      environment: prod
      displayName: "production"
      target: dev
      dependsOn: [Build, Deploy_preprod]
      previousStage: Deploy_preprod
      branchMatch: "eq(variables['Build.SourceBranch'], 'refs/heads/main')"
      hotfixEnvironment: ${{ parameters.hotfixEnvironment }}
      deployInfraAll: ${{ parameters.deployInfraAll }}
